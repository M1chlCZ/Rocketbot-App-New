name: rocketbot
description: Rocketpro

publish_to: 'none'

version: 1.2.70+218

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_messaging: any
  firebase_core: any
  firebase_auth: any
  google_sign_in: ^7.2.0
  auto_size_text: 3.0.0
  auto_size_text_field: ^2.3.0
  intl: any
  fl_chart: ^1.2.0
  progress_indicators: ^1.0.0
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  decimal: ^3.0.2
  flutter_snake_navigationbar: any
  appinio_social_share: ^0.3.2
  cached_network_image: ^4.0.4
  permission_handler: ^13.0.2
  local_auth: ^3.0.2
  flutter_phoenix: ^1.1.1
  package_info_plus: ^10.2.2
  path_provider: any
  sign_in_with_apple: ^8.2.0
  flutter_displaymode: ^0.7.0
  flutter_local_notifications: ^22.3.1
  flutter_udid: ^4.1.6
  sqflite: ^2.4.0
  jiffy: ^6.3.1
  sprintf: any
  slide_to_act: ^2.0.2
  share_plus: ^13.3.1
  device_info_plus: ^13.3.0
  app_badge_plus: ^1.3.5
  universal_io: any
  webviewx:
    git:
      url: https://github.com/M1chlCZ/webviewx
      ref: main
  flutter_riverpod: ^3.4.3
  flutter_speed_dial: ^7.0.0
  animated_toggle_switch: ^0.8.3
  sliding_number: ^0.0.4
  animated_text_kit: ^4.2.2
  get_it: any
  web_socket_channel: ^3.0.3
  cupertino_icons: ^2.0.0
  rxdart: ^0.28.0
  logger: any
  app_links: ^7.2.1
  lock_screen_pin: ^0.1.1
  disk_cached_image: ^0.1.1
  atomic_ui_kit: ^0.1.3
  core_utils_kit: ^0.1.1
  qr_scanner_kit: ^0.1.1
  json_rest_client: ^0.1.2

linter:
  rules:
    -use_super_parameters


dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  melos: 6.3.3



flutter_launcher_name:
  name: "RocketPro"

flutter:
  uses-material-design: true

  generate: true

  assets:
    - images/


  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Italic.ttf
          style: italic
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 800
        - asset: fonts/Poppins-Light.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
    - family: JosefinSans
      fonts:
        - asset: fonts/JosefinSans-Regular.ttf
          weight: 500
        - asset: fonts/JosefinSans-Medium.ttf
          weight: 600
        - asset: fonts/JosefinSans-SemiBold.ttf
          weight: 800

